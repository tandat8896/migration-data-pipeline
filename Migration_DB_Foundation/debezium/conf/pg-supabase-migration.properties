# Debezium Config: Postgres Supabase → Kafka
# Source: Postgres Supabase (Cloud)
# Tables: customers, orders, order_items
# Publication: migration_pub

# 1. SINK - Send to Kafka
debezium.sink.type=kafka
debezium.sink.kafka.producer.bootstrap.servers=localhost:9092
debezium.sink.kafka.producer.key.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.sink.kafka.producer.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# 2. FORMAT
debezium.format.key=json
debezium.format.value=json

# 3. SOURCE - Postgres Supabase
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.plugin.name=pgoutput

# NOTE: Fill these from SUPABASE_DB_URL
# Format: postgresql://postgres:[PASSWORD]@db.[PROJECT-REF].supabase.co:5432/postgres
debezium.source.database.hostname=db.CHANGE_ME.supabase.co
debezium.source.database.port=5432
debezium.source.database.user=postgres
debezium.source.database.password=CHANGE_ME
debezium.source.database.dbname=postgres
debezium.source.database.sslmode=require

# 4. PUBLICATION & REPLICATION
debezium.source.publication.name=migration_pub
debezium.source.slot.name=debezium_pg_supabase

# 5. FILTER - Migration tables only
debezium.source.topic.prefix=pg_supabase
debezium.source.schema.include.list=public
debezium.source.table.include.list=public.customers,public.orders,public.order_items

# 6. SNAPSHOT MODE
debezium.source.snapshot.mode=initial

# 7. OFFSET STORAGE
debezium.source.offset.storage.file.filename=data/offsets-pg-supabase.dat
debezium.source.offset.flush.interval.ms=1000

# 8. TRANSFORMS - Add metadata
debezium.transforms=addTimestamp
debezium.transforms.addTimestamp.type=org.apache.kafka.connect.transforms.InsertField$Value
debezium.transforms.addTimestamp.timestamp.field=_migration_ts

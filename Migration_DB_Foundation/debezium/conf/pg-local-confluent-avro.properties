# Debezium Server Config: Postgres → Kafka with Confluent Schema Registry
# Format: Avro (using Confluent Schema Registry)

# 1. SINK - Kafka
debezium.sink.type=kafka
debezium.sink.kafka.producer.bootstrap.servers=localhost:9092,localhost:9094
debezium.sink.kafka.producer.key.serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
debezium.sink.kafka.producer.value.serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
debezium.sink.kafka.producer.schema.registry.url=http://localhost:8081

# 2. FORMAT - Avro (Confluent)
debezium.format.key=avro
debezium.format.value=avro

# 3. CONFLUENT SCHEMA REGISTRY (for format converter)
debezium.format.key.schema.registry.url=http://localhost:8081
debezium.format.value.schema.registry.url=http://localhost:8081

# 4. SOURCE - Postgres Local
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.database.hostname=127.0.0.1
debezium.source.database.port=5432
debezium.source.database.user=fastapi_user
debezium.source.database.password=${DB_PASSWORD}
debezium.source.database.dbname=fastapi_db
debezium.source.database.sslmode=require

# 5. PUBLICATION
debezium.source.publication.name=migration_pub
debezium.source.slot.name=debezium_pg_local_avro

# 6. FILTER
debezium.source.topic.prefix=pg_local_avro_v2
debezium.source.schema.include.list=public
debezium.source.table.include.list=public.customers,public.orders,public.order_items
debezium.source.plugin.name=pgoutput

# 7. SNAPSHOT
debezium.source.snapshot.mode=initial

# 8. OFFSET STORAGE
debezium.source.offset.storage.file.filename=data/offsets-pg-local-avro.dat
debezium.source.offset.flush.interval.ms=1000

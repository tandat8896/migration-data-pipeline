# Debezium Config: MongoDB Atlas → Kafka (JSON format)
# Source: MongoDB Atlas
# Collections: customer_events, inventory_snapshots
# Database: zdm_test

# 1. SINK - Send to Kafka (JSON)
debezium.sink.type=kafka
debezium.sink.kafka.producer.bootstrap.servers=localhost:9092
debezium.sink.kafka.producer.key.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.sink.kafka.producer.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# 2. FORMAT - JSON (working format)
debezium.format.key=json
debezium.format.value=json

# 3. SOURCE - MongoDB Atlas
debezium.source.connector.class=io.debezium.connector.mongodb.MongoDbConnector
debezium.source.mongodb.connection.string=${MONGO_URL}

# 4. FILTER - Collections
debezium.source.topic.prefix=mongo_atlas
debezium.source.database.include.list=zdm_test
debezium.source.collection.include.list=zdm_test.customer_events,zdm_test.inventory_snapshots

# 5. SNAPSHOT MODE
debezium.source.snapshot.mode=initial

# 6. OFFSET STORAGE
debezium.source.offset.storage.file.filename=data/offsets-mongo.dat
debezium.source.offset.flush.interval.ms=1000

# 7. TRANSFORMS - Add metadata
debezium.transforms=addTimestamp
debezium.transforms.addTimestamp.type=org.apache.kafka.connect.transforms.InsertField$Value
debezium.transforms.addTimestamp.timestamp.field=_migration_ts
